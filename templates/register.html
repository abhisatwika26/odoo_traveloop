<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-screen py-10" style="background-image: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center;">
    
    <div class="fixed inset-0 bg-black/30 dark:bg-black/60 pointer-events-none"></div>

    <div class="relative bg-white/95 dark:bg-gray-900/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-2xl border border-gray-200 dark:border-gray-700 my-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-teal-600 dark:text-teal-400">Create an Account</h1>
            <p class="text-gray-600 dark:text-gray-400">Start planning your next adventure today.</p>
        </div>

        {% with messages = get_flashed_messages(category_filter=["error"]) %}
            {% if messages %}
                <div class="mb-4 p-3 rounded bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800 text-sm text-center">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">First Name</label>
                    <input class="shadow-sm appearance-none border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500" name="first_name" type="text" required>
                </div>
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Last Name</label>
                    <input class="shadow-sm appearance-none border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500" name="last_name" type="text" required>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Email Address</label>
                    <input class="shadow-sm appearance-none border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500" name="email" type="email" required>
                </div>
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Phone Number</label>
                    <input class="shadow-sm appearance-none border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500" name="phone_number" type="tel">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">City</label>
                    <input class="shadow-sm appearance-none border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500" name="city" type="text">
                </div>
                <div>
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Country</label>
                    <input class="shadow-sm appearance-none border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-500" name="country" type="text">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">Password</label>
                <input class="shadow-sm appearance-none border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 rounded w-full py-2 px-3 text-gray-700 dark:text-gray-200 mb-3 focus:outline-none focus:ring-2 focus:ring-teal-500" name="password" type="password" required>
            </div>

            <div class="mb-6 flex items-center">
                <input type="checkbox" id="terms" required class="w-4 h-4 text-teal-600 border-gray-400 dark:border-gray-600 rounded focus:ring-teal-500 bg-gray-100 dark:bg-gray-800">
                <label for="terms" class="ml-2 text-sm text-gray-700 dark:text-gray-300">I agree to the Terms and Conditions</label>
            </div>

            <button class="bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 px-6 rounded-lg w-full focus:outline-none transition duration-200 shadow-lg" type="submit">
                Register
            </button>
            
            <div class="text-center mt-6">
                <a class="text-sm font-bold text-teal-600 dark:text-teal-400 hover:text-teal-800 dark:hover:text-teal-300 transition" href="{{ url_for('login') }}">
                    Already have an account? Login here.
                </a>
            </div>
        </form>
    </div>
</body>
</html>
