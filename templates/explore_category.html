<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore {{ category_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        function toggleMenu() { document.getElementById('dropdown-menu').classList.toggle('hidden'); }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#121212] text-gray-900 dark:text-gray-200 min-h-screen font-sans transition-colors duration-300 pb-20">

    <nav class="flex justify-between items-center p-4 border-b border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('create_trip') }}" class="text-gray-500 hover:text-teal-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </a>
            <a href="#" class="text-2xl font-bold text-teal-600 dark:text-teal-500 tracking-wide hover:opacity-80">Traveloop</a>
        </div>
        
        <div class="flex items-center gap-4 relative">
            <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 dark:text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            </button>
            <button onclick="toggleMenu()" class="p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-800 transition text-gray-700 dark:text-gray-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <div id="dropdown-menu" class="hidden absolute top-12 right-12 w-56 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-xl overflow-hidden z-50">
                <a href="#" class="block px-4 py-3 text-sm text-gray-700 dark:text-gray-300 hover:bg-teal-50 dark:hover:bg-teal-900/30">Dashboard</a>
                <a href="{{ url_for('create_trip') }}" class="block px-4 py-3 text-sm text-teal-600 dark:text-teal-400 font-bold hover:bg-teal-50 dark:hover:bg-teal-900/30 border-t border-gray-100 dark:border-gray-700">+ Create an Itinerary</a>
            </div>
            <div class="w-10 h-10 rounded-full border-2 border-teal-500 overflow-hidden cursor-pointer flex items-center justify-center bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-white font-bold shadow-md">
                {{ user_initial }}
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-8 mt-4">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Explore: {{ category_name }}</h1>
            <p class="text-gray-600 dark:text-gray-400">Discover top-rated destinations and activities to add to your itinerary.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for item in items %}
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 flex flex-col">
                <div class="h-48 w-full relative">
                    <img src="{{ item.image }}" alt="{{ item.name }}" class="w-full h-full object-cover">
                    <div class="absolute top-4 right-4 bg-white/90 dark:bg-black/70 backdrop-blur text-gray-900 dark:text-teal-400 font-bold py-1 px-3 rounded-full text-sm shadow-md">
                        Est. {{ item.budget }}
                    </div>
                </div>
                <div class="p-5 flex-grow flex flex-col justify-between">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">{{ item.name }}</h3>
                        <p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed mb-4">{{ item.description }}</p>
                    </div>
                    <a href="{{ url_for('create_trip') }}" class="w-full block text-center py-2 border border-teal-500 text-teal-600 dark:text-teal-400 font-semibold rounded-lg hover:bg-teal-50 dark:hover:bg-teal-900/30 transition">
                        Add to Itinerary
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
